server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend lives on the internal app-network only; proxy it here so the
    # browser only ever talks to this origin (no CORS setup needed).
    # /api/v1/... -> http://backend:8080/api/v1/... (prefix preserved: the
    # matched "/api/" location prefix is replaced with the "/api/" proxy_pass
    # URI, so the /v1/... remainder passes through unchanged).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing: unknown paths fall back to index.html so react-router
    # can handle client-side routes on a hard reload/direct link.
    location / {
        try_files $uri /index.html;
    }
}
