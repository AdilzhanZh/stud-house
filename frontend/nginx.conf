server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nginx's compiled-in default (1M) is smaller than a typical photo, which
    # made image uploads fail with a bare 413 before reaching the backend.
    client_max_body_size 15M;

    # Backend lives on the internal app-network only; proxy it here so the
    # browser only ever talks to this origin (no CORS setup needed).
    # /api/v1/... -> http://backend:8080/api/v1/... (prefix preserved: the
    # matched "/api/" location prefix is replaced with the "/api/" proxy_pass
    # URI, so the /v1/... remainder passes through unchanged).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        # $host drops the port; the backend needs the real port to build
        # absolute upload URLs (POST /uploads), so forward the raw Host header.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # nginx's default types don't know .webmanifest. Like /sw.js (served by the
    # catch-all below), it keeps a fixed name, so browsers must re-check it.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite fingerprints asset filenames (index-<hash>.js), so they can be
    # cached forever — a new build always gets new names.
    location /assets/ {
        # nginx's default types don't include .mjs, and browsers refuse to run a
        # module worker (pdf.js's) served as application/octet-stream.
        location ~ \.mjs$ {
            types { }
            default_type application/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routing: unknown paths fall back to index.html so react-router
    # can handle client-side routes on a hard reload/direct link.
    # index.html must never be cached: without this header browsers cache
    # it heuristically and keep loading the previous build after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
